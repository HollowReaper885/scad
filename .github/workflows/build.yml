name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show repository files
        run: find . -not -path './.git/*' -maxdepth 3 | head -50
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: |
          S=$(find . -name settings.gradle -not -path './.git/*' | head -1)
          if [ -z "$S" ]; then echo "settings.gradle not found anywhere in the repo"; exit 1; fi
          cd "$(dirname "$S")"
          gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: audiocassettes-fabric-jar
          path: "**/build/libs/*.jar"
